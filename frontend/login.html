<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in - Business AI Agent</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="auth"><form id="authForm" class="card" data-endpoint="/api/auth/login">
<div class="logo"><i></i>Business AI Agent</div><h1 style="margin-top:18px">Log in</h1>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="err" id="err" role="alert"></div><button class="btn" style="width:100%;margin-top:8px">Log in</button>
<p style="font-size:14px;text-align:center">New here? <a href="/register.html">Create a business account</a></p></form></div>
<script src="/js/api.js"></script><script src="/js/app.js"></script></body></html>
